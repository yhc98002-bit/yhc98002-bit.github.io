<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ee">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171511">
  <!-- GitHub Pages renders this page at any path depth, so relative paths
       are unreliable: all styles are inline and no external assets are used. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #faf6ee;
      --text: #201d17;
      --text-secondary: #6b6255;
      --accent: #1a4d8f;
      --on-accent: #ffffff;
    }
    [data-theme="dark"] {
      --bg: #171511;
      --text: #ede7db;
      --text-secondary: #a79e8d;
      --accent: #8fb4e3;
      --on-accent: #0e2a50;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]) {
        --bg: #171511;
        --text: #ede7db;
        --text-secondary: #a79e8d;
        --accent: #8fb4e3;
        --on-accent: #0e2a50;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
    h1 {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 110px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    p { margin: 16px 0 32px; font-size: 18px; color: var(--text-secondary); }
    a {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 3px;
      background: var(--accent);
      color: var(--on-accent);
      text-decoration: none;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The page you&rsquo;re looking for doesn&rsquo;t exist, or has moved.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
