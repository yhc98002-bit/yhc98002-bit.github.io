<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面不存在</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages 会在任意深度的路径下渲染本页,相对路径会失效,
       因此本页样式全部内联,不依赖 css/style.css -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0066cc;
    }
    [data-theme="dark"] {
      --bg: #161617;
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --accent: #2997ff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]) {
        --bg: #161617;
        --text: #f5f5f7;
        --text-secondary: #a1a1a6;
        --accent: #2997ff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
    h1 { font-size: 96px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
    p { margin: 16px 0 32px; font-size: 18px; color: var(--text-secondary); }
    a {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 980px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>你要找的页面不存在,或者已经搬走了。</p>
    <!-- 注意:若部署在项目子路径(username.github.io/仓库名/),把下面的 href 改为 /仓库名/ -->
    <a href="/">回到首页</a>
  </main>
</body>
</html>
