<!DOCTYPE html>
<!-- ============================================================
     Post template. To write a new post:
     1. Copy this file WITHIN blog/posts/ and rename it to
        YYYY-MM-DD-short-slug.html
     2. Update <title>, meta description, the og: tags, the <h1>,
        the <time> (both the datetime attribute and the visible text)
        and the tags list
     3. Add a canonical link and og:url with the post's absolute URL
     4. Write the body inside <div class="post-body">
        (available elements: p, h2/h3, ul/ol, blockquote, code,
        pre>code, figure>img+figcaption, hr — styles are ready)
     5. Add an entry card at the top of the list in blog/index.html
     Note: this file must stay in blog/posts/ — the relative paths
     (../../) break anywhere else.
     ============================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post title — Haocun Ye</title>
  <meta name="description" content="One-sentence summary of the post.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ee">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171511">

  <meta property="og:type" content="article">
  <meta property="og:title" content="Post title">
  <meta property="og:description" content="One-sentence summary of the post.">
  <!-- og:url and og:image must be ABSOLUTE URLs, e.g.
       <meta property="og:url" content="https://yhc98002-bit.github.io/blog/posts/your-slug.html">
       <meta property="og:image" content="https://yhc98002-bit.github.io/assets/images/your-cover.png"> -->

  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <link rel="preload" href="../../assets/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Theme restore: runs before CSS so dark-mode users never see a light flash -->
  <script>
    (function () {
      /* JS 标记先于 CSS 生效,慢网络下 .reveal 内容不会先显后隐再浮现 */
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="../../index.html">Haocun Ye · <span class="brand-zh" lang="zh-Hans">叶浩存</span></a>

      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="../../index.html#news">News</a>
        <a href="../../index.html#publications">Publications</a>
        <a href="../../index.html#projects">Projects</a>
        <a href="../../index.html#about">About</a>
        <a class="active" href="../index.html" aria-current="true">Blog</a>
        <a href="../../index.html#contact">Contact</a>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>

        <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-nav">
          <svg class="icon-menu" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
          <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="post">
    <div class="container narrow">
      <a class="back-link" href="../index.html">&larr; All posts</a>

      <article>
        <header class="post-header">
          <!-- TODO: title, date (two places) and tags -->
          <h1>Post title</h1>
          <p class="post-meta"><time datetime="2026-01-01">January 1, 2026</time></p>
          <ul class="post-tags">
            <li>Tag one</li>
            <li>Tag two</li>
          </ul>
        </header>

        <div class="post-body">
          <!-- TODO: write the post here -->
          <p>First paragraph.</p>
          <p>Second paragraph.</p>
        </div>
      </article>

      <div class="post-footer">
        <a class="back-link" href="../index.html">&larr; All posts</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 Haocun Ye · <span lang="zh-Hans">叶浩存</span></span>
      <span>Built with plain HTML / CSS / JS · Typeset in Instrument Serif</span>
    </div>
  </footer>

  <script src="../../js/main.js" defer></script>
</body>
</html>
